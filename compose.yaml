name: loja-pedidos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: loja
      POSTGRES_DB: loja
    ports:
      - "5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loja -d loja"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  seed:
    build: .
    command: npm run seed
    environment:
      DATABASE_URL: postgres://loja:loja@postgres:5432/loja
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: npm run start:api
    environment:
      DATABASE_URL: postgres://loja:loja@postgres:5432/loja
      REDIS_URL: redis://redis:6379
      API_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build: .
    command: npm run start:worker
    environment:
      DATABASE_URL: postgres://loja:loja@postgres:5432/loja
      REDIS_URL: redis://redis:6379
      WORKER_PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/regras:/etc/prometheus/regras
      - prometheus-dados:/prometheus

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-dados:/var/lib/grafana

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-dados:/alertmanager

  receptor-alertas:
    image: node:20-alpine
    working_dir: /app
    entrypoint: ["node", "/app/index.js"]
    ports:
      - "9099:9099"
    volumes:
      - ./receptor-alertas:/app

  carga:
    image: node:20-alpine
    working_dir: /app
    entrypoint: ["node", "/app/index.js"]
    command: ["normal"]
    environment:
      API_URL: http://api:8080
    volumes:
      - ./carga:/app
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - carga

volumes:
  postgres-dados:
  prometheus-dados:
  grafana-dados:
  alertmanager-dados:
