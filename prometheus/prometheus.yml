global:
  scrape_interval: 15s
  evaluation_interval: 15s

# O compose ja monta ./prometheus/regras em /etc/prometheus/regras, mas o
# arquivo base nao declarava `rule_files`: sem esta secao a regra existe no
# disco e o Prometheus nunca a carrega.
rule_files:
  - /etc/prometheus/regras/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: api
    static_configs:
      - targets:
          - api:8080

  - job_name: worker
    static_configs:
      - targets:
          - worker:8081
